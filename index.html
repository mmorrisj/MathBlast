<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MathBlast</title>
<meta name="theme-color" content="#04060f">
<meta name="description" content="Stop the descending beasts by solving math problems.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<style>
  /* The font ships with the game. It used to come from Google Fonts, which is
     fine for a web page and useless for an installed app: the first launch on
     a plane would have fallen back to the system monospace, and the layout is
     tuned to this one's metrics. One variable file covers 400-700. */
  @font-face {
    font-family: "JetBrains Mono";
    src: url("./assets/font/jetbrains-mono-latin.woff2") format("woff2");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #04060f;
    overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Phones otherwise pan, pinch and flash a selection highlight mid-game. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: grid;
    place-items: center;
    /* Installed full-screen, the canvas is centred inside the cutouts rather
       than under them. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    /* Faint field glow behind the letterbox bars. */
    background:
      radial-gradient(ellipse at 50% 120%, #12163a 0%, #04060f 60%),
      #04060f;
  }
  #game {
    display: block;
    image-rendering: auto;
    border-radius: 6px;
    box-shadow: 0 0 90px rgba(60, 170, 255, 0.14), 0 0 0 1px rgba(120, 190, 255, 0.09);
    touch-action: none;
  }
  /* Name entry rides a real input so phones raise the native keyboard. It is
     invisible: the canvas draws the field, this only carries focus and text. */
  #nameField {
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    width: 320px;
    height: 60px;
    padding: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    font-size: 16px;             /* below 16px iOS zooms the page on focus */
    text-align: center;
    z-index: 5;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(150, 200, 235, 0.35);
    font-size: 12px;
    letter-spacing: 0.06em;
    pointer-events: none;
    user-select: none;
  }
  /* The on-screen buttons carry these on a phone; the strip just adds clutter. */
  @media (pointer: coarse) { #hint { display: none; } }
</style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="MathBlast game"></canvas>
  <input id="nameField" type="text" maxlength="40" autocomplete="off"
         autocorrect="off" autocapitalize="words" spellcheck="false"
         aria-label="Player name">
  <div id="hint">H how to play &nbsp;·&nbsp; T top 20 &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</div>
  <script type="module" src="./src/main.js"></script>
  <script>
    // Registration lives here rather than in main.js so the game module stays
    // free of anything that only makes sense when it is served over HTTP.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((e) => {
          // Offline support is an enhancement; the game runs regardless.
          console.warn('service worker not registered:', e.message);
        });
      });
    }
  </script>
</body>
</html>
